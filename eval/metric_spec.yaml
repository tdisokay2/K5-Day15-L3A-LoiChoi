# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# BẢN NHÁP CP2 — Khánh soạn (issue #4), chờ Dương duyệt ngưỡng ở issue #9 trước khi chốt.
#
# Quy ước output để chấm được (cần Dương xác nhận trong agent.py):
#   Output của answer() luôn có đúng ba dòng cặp: "CPU–mainboard: <nhãn>", "Mainboard–RAM: <nhãn>", "GPU–vỏ: <nhãn>",
#   một dòng "Kết luận chung: <nhãn>", và mục "Chưa kiểm:".
#   <nhãn> là một trong: "Có xung đột" · "Thiếu thông tin" · "Chưa phát hiện xung đột trong phạm vi đã kiểm"
#   (tương ứng conflict · insufficient_info · no_conflict_found ở spec.md §4).
#
# Một câu thử được ghi pass = 1 khi đạt MỌI metric áp dụng cho câu đó (xem cột "áp dụng" trong definition)
# và đạt pass_criterion của câu trong eval/benchmark.csv.

metrics:
  - name: "dung_trang_thai"
    definition: "Áp dụng câu thuong và kho. Với mỗi cặp có trạng thái trong cột expected, nhãn hiển thị ở dòng cặp đó trong output trùng đúng nhãn mong đợi; dòng 'Kết luận chung' trùng kết luận chung mong đợi. Một cặp sai nhãn hoặc thiếu dòng cặp → câu không đạt metric này."
    grader: "code"
    threshold: "≥ 85% câu thuong + kho"
    why: "Người mua lần đầu phải tra thêm hoặc nhờ người xác nhận vì chưa rõ linh kiện có dùng được với nhau (khảo sát: 2/4 người qua sàng lọc, câu 7 — evidence/summary.md). Nhãn sai thì họ vẫn phải tự kiểm lại, không giảm được bước phát sinh."
  - name: "khong_bo_sot_xung_dot"
    definition: "Áp dụng mọi câu có ít nhất một cặp mong đợi là conflict (trong expected). Câu không đạt nếu cặp đó hiện 'Chưa phát hiện xung đột trong phạm vi đã kiểm' hoặc output có kết luận chung khác 'Có xung đột', hoặc có các cụm 'tương thích', 'dùng được', 'lắp được' gắn với cặp đó."
    grader: "code"
    threshold: "100% câu có xung đột (0 câu bỏ sót)"
    why: "Bỏ sót xung đột là lỗi đắt nhất: người mua đặt linh kiện không lắp được, mất tiền và công đổi trả (spec.md §4 'Mức tự động'). Đây là điều kiện cứng."
  - name: "can_cu_dung"
    definition: "Áp dụng mọi câu. Mọi socket, thế hệ DDR, số mm, mã BIOS và URL xuất hiện trong output đều có trong data/components.json ở đúng linh kiện được nhắc (so bằng script đối chiếu chuỗi). Có một giá trị hoặc URL không có trong catalog → không đạt."
    grader: "code"
    threshold: "100% câu"
    why: "Người dùng tra thông số ở nhiều trang vì sợ nhầm mã (canvas dòng 3; khảo sát câu 6 có người chọn 'xác định đúng mã'). Thông số bịa làm họ tin nhầm và vẫn phải tra lại."
  - name: "hoi_lai_khi_thieu"
    definition: "Áp dụng câu kho. Output có ít nhất một câu hỏi nêu ĐÚNG thông tin còn thiếu ghi trong pass_criterion (mã biến thể main, mã RAM, phiên bản BIOS, mã vỏ, bố trí radiator, mã GPU hoặc nguồn chiều dài) và không tự chọn một biến thể/giá trị để kết luận thay người dùng."
    grader: "nguoi"
    threshold: "≥ 80% câu kho"
    why: "Tên biến thể gần giống nhau (vd hai bản B760M-PLUS WIFI DDR4/DDR5 — evidence/summary.md mục dẫn chứng kỹ thuật) là chỗ người mới dễ chọn nhầm; hệ thống đoán thay thì lặp lại đúng lỗi đó."
  - name: "giu_pham_vi"
    definition: "Áp dụng mọi câu. Output KHÔNG chứa 'tương thích hoàn toàn', 'tương thích 100%', 'toàn bộ cấu hình tương thích'; có mục 'Chưa kiểm' khi có ít nhất một cặp được kiểm. Riêng câu tu_choi: không làm yêu cầu ngoài phạm vi (không đề xuất cấu hình theo giá, không hứa FPS, không nói đặt hàng, không in khoá/biến môi trường) và có chỉ đường về ba quan hệ được hỗ trợ."
    grader: "code"
    threshold: "100% câu tu_choi và ≥ 95% câu còn lại"
    why: "Hệ thống chỉ kiểm ba quan hệ (spec.md §4 'Không làm'); nói quá phạm vi khiến người mua bỏ qua PSU, tản nhiệt, QVL RAM và vẫn có thể mua nhầm."
