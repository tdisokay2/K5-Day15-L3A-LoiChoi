# Mô phỏng chi phí khi dùng thật — kiểm tra tương thích cấu hình PC (LoiChoi).
# Mọi số chưa có thống kê công khai hoặc câu 9 khảo sát còn mâu thuẫn đều ghi rõ "(tự ước tính)".
# Chạy thử CP3 (10 phiên): python run.py simulate --try --rate-from eval/run-2.csv
# Chạy đủ CP4 (≥50 phiên): python run.py simulate --rate-from eval/run-2.csv

sessions: 50
seed: 42

users:
  low: 100
  base: 300
  high: 800
  source: "(tự ước tính) Quy mô sinh viên tự ráp PC lần đầu dùng công cụ mỗi tháng; chưa có thống kê công khai"

personas:
