# Mô phỏng chi phí khi dùng thật — kiểm tra tương thích cấu hình PC (LoiChoi).
# Mọi số không có thống kê công khai đều ghi rõ "(tự ước tính)".
# Chạy thử CP3 (10 phiên): python run.py simulate --try --rate-from eval/run-1.csv
# Chạy đủ CP4 (≥50 phiên): python run.py simulate --rate-from eval/run-1.csv

sessions: 50
seed: 42

users:
  low: 100
  base: 300
  high: 800
  source: "(tự ước tính) Quy mô sinh viên tự ráp PC lần đầu dùng công cụ rà cấu hình mỗi tháng; chưa có thống kê công khai"

personas:
  - name: nguoi_moi_ra_mot_lan
    share: 0.50
    uses_per_month: 1
    turns_per_session: 2
    source: "evidence/summary.md (1/3 phỏng vấn P2 rà 1 lần rồi mua; 4/10 khảo sát câu 9 chọn 0 lần phát sinh thêm); số lượt/tháng và lượt/phiên (tự ước tính)"
  - name: nguoi_chinh_sua_nhieu_lan
    share: 0.35
    uses_per_month: 2
    turns_per_session: 3
    source: "evidence/summary.md (5/10 khảo sát câu 9 chọn 2 lần; P1 và P3 đổi linh kiện khi ráp/hết hàng); số lượt/phiên (tự ước tính)"
  - name: nguoi_hoi_nhieu_cau_hinh
    share: 0.15
    uses_per_month: 4
    turns_per_session: 4
    source: "(tự ước tính) Người so sánh nhiều cấu hình hoặc hỏi lại nhiều biến thể trong tháng"

prices:
  - model: openai/gpt-4.1-mini
    input: 0.40
    output: 1.60
    source: "https://openrouter.ai/openai/gpt-4.1-mini · kiểm tra 28/11/2026"
  - model: openai/gpt-4.1-nano
    input: 0.10
    output: 0.40
    source: "https://openrouter.ai/openai/gpt-4.1-nano · kiểm tra 28/11/2026"

usd_to_vnd:
  rate: 25400
  source: "(tự ước tính) Tỷ giá tham khảo USD/VND tại 28/11/2026"
