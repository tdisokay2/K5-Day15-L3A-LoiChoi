    share: 0.50
    uses_per_month: 1
    turns_per_session: 2
    source: "(tự ước tính) Dựa định tính từ phỏng vấn P2 (rà 1 lần trước khi mua, 0 phút phát sinh); tần suất tháng và lượt/phiên tự ước tính"
  - name: nguoi_chinh_sua_nhieu_lan
    share: 0.35
    uses_per_month: 2
    turns_per_session: 3
